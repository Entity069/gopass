name: Verify CLI Login

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks and race tests
        run: make check
      - name: Real terminal tests
        run: make smoke
      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build Docker image
        run: docker compose build
      - name: Container terminal and persistence tests
        run: python3 scripts/smoke.py --docker
